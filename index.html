<style>

<div id="rot">Շրջիր հեռախոսը հորիզոնական, որ խաղաս ↻<br><br>Turn your phone sideways to play ↻</div>
<canvas id="c" width="960" height="540"></canvas>
<script>
'use strict';
/* =========================================================
   NINJAGO: THE DARK TOWER  —  a little co-op ninja adventure
   ========================================================= */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 540, GROUND = 470, GRAV = 1900, EGRAV = 900;
function fit(){ const s = Math.min((innerWidth - 32) / W, innerHeight / H); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
addEventListener('resize', fit); fit();

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = a => a[Math.floor(Math.random() * a.length)];
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill(); }
function poly(p){ ctx.beginPath(); ctx.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]); ctx.closePath(); ctx.fill(); }
function line(x1, y1, x2, y2){ ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function circle(x, y, r){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ell(x, y, rx, ry, rot){ ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill(); }
function overlap(a, b){ return a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1; }
function boxOf(e){ return { x1: e.x - e.w / 2, x2: e.x + e.w / 2, y1: e.y - e.h, y2: e.y }; }
function pbox(p){ return { x1: p.x - 15, x2: p.x + 15, y1: p.y - 76, y2: p.y }; }
const FONT = "'Trebuchet MS', Verdana, 'Noto Sans Armenian', sans-serif";
try { document.fonts.load("bold 20px 'Noto Sans Armenian'"); } catch (e) {}
function txt(s, x, y, size, col, align, stroke, maxW){
  s = tr(s); align = align || 'center';
  ctx.font = 'bold ' + size + 'px ' + FONT; ctx.textAlign = align; ctx.textBaseline = 'middle';

  teams.push({ owner, fight, t: 0, x: owner.x, y: Math.min(owner.y, ground), f: owner.facing, members: [me].concat(helpers), tick: 0 });

// ---------- studs = power: every 100 studs collected gives the collector a power-up ----------
let coinAcc = 0;
function addCoins(v, who, fight){
  coinAcc += v; let n = 0;
  while (coinAcc >= 100){ coinAcc -= 100; n++; }
  if (!n) return;
  const pl = players[who.idx];
  if (fight){ who.meter = Math.min(100, who.meter + 20 * n); who.hp = Math.min(100, who.hp + 4 * n); }
  else { who.spin = Math.min(100, who.spin + 20 * n); who.hp = Math.min(who.maxHp, who.hp + 0.5 * n); }

function raceAI(r, dt){

function raceShoot(r, rocket){

function updateRaceShots(dt){

    }
    s.x += s.vx * dt;

function smallCup(x, y, rot, k, sc){

  "Come in, ninja. This is my Safe House. Golden shields protect it, so no enemy can ever come in here.": "Ներս եկեք, նինջաներ։ Սա իմ Ապահով տունն է։ Ոսկե վահանները պաշտպանում են այն, և ոչ մի թշնամի այստեղ չի կարող մտնել։",
  "We beat Samukai! Four arms and four daggers, and he still lost!": "Մենք հաղթեցինք Սամուկային։ Չորս ձեռք ու չորս դաշույն ուներ, բայց միևնույն է պարտվեց!",
  "Did you see his face when he fell apart? Ha! Best fight ever.": "Տեսա՞ք նրա դեմքը, երբ քանդվեց։ Հա՛։ Ամենալավ կռիվն էր։",
  "I was a little bit scared at first. But we did it together!": "Սկզբում մի քիչ վախեցա։ Բայց մենք միասին արեցինք դա!",

const trCache = new Map();
let trRe = null;
function trBuild(){
  const keys = Object.keys(HY).filter(k => k.trim().length >= 3).sort((a, b) => b.length - a.length);
  // word edges only matter where a key starts or ends with a letter (keys like ' is defeated!' sit right after a name)
  const esc = k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const make = lb => keys.map(k => (lb && /^[A-Za-z]/.test(k) ? '(?<![A-Za-z])' : '') + esc(k) + (/[A-Za-z]$/.test(k) ? '(?![A-Za-z])' : '')).join('|');
  try { trRe = new RegExp(make(true), 'g'); } catch (e) { trRe = new RegExp(make(false), 'g'); }
}
function tr(s){
  if (LANG !== 'hy' || typeof s !== 'string' || !/[A-Za-z]/.test(s)) return s;
  let r = trCache.get(s); if (r !== undefined) return r;
  if (HY[s] !== undefined) r = HY[s];
  else { if (!trRe) trBuild(); r = s.replace(trRe, m => HY[m]); }
  if (trCache.size > 4000) trCache.clear();
  trCache.set(s, r); return r;
}

function newMathQ(num, earned){
  let a, b, op, ans;
  if (Math.random() < 0.55){ ans = mRand(2, 10); a = mRand(0, ans); b = ans - a; op = '+'; }
  else { a = mRand(2, 10); b = mRand(0, a); ans = a - b; op = '−'; }
  const opts = [ans];
  while (opts.length < 3){ const w = ans + pick([-3, -2, -1, 1, 2, 3]); if (w >= 0 && w <= 12 && !opts.includes(w)) opts.push(w); }
  opts.sort(() => Math.random() - 0.5);

}
